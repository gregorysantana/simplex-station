<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estación · Entrada de paquetes</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">
<div class="max-w-6xl mx-auto p-4">
  <h1 class="text-2xl font-bold mb-3">Estación · Entrada de paquetes <span class="text-xs text-slate-400">(IA: {{ cfg.ai_mode }})</span></h1>
  <div class="grid md:grid-cols-2 gap-4">
    <!-- Cámara (del navegador) -->
    <div class="bg-white rounded-xl shadow p-3">
      <div class="flex gap-2 mb-2">
        <select id="camSel" class="flex-1 border rounded-lg px-2 py-1.5 text-sm"></select>
        <button id="btnCamStart" class="bg-slate-700 text-white rounded-lg px-3 text-sm">Iniciar</button>
      </div>
      <video id="cam" autoplay playsinline muted class="w-full rounded-lg bg-black aspect-video"></video>
      <canvas id="canvas" class="hidden"></canvas>
      <div class="flex gap-2 mt-3">
        <button id="btnCapture" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2 font-semibold">📸 Capturar etiqueta</button>
        <button id="btnWeight" class="bg-violet-600 hover:bg-violet-700 text-white rounded-lg px-4">⚖️ Pesar</button>
      </div>
      <div id="capMsg" class="text-xs text-slate-500 mt-2"></div>
    </div>

    <!-- Formulario -->
    <div class="bg-white rounded-xl shadow p-4 space-y-3">
      <div>
        <label class="text-xs text-slate-500">Tracking (código de barras)</label>
        <input id="fTracking" class="w-full border rounded-lg px-3 py-2 font-mono">
      </div>
      <div>
        <label class="text-xs text-slate-500">Cliente (casillero / nombre)</label>
        <input id="fClientSearch" class="w-full border rounded-lg px-3 py-2" placeholder="Escribe y presiona Enter (25 → H-000025)">
        <input type="hidden" id="fClientId">
        <div id="clientPicked" class="text-sm mt-1 hidden"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-slate-500">Contenido</label><input id="fContent" class="w-full border rounded-lg px-3 py-2"></div>
        <div><label class="text-xs text-slate-500">Suplidor</label><input id="fSupplier" class="w-full border rounded-lg px-3 py-2"></div>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div><label class="text-xs text-slate-500">Transportista</label><input id="fCarrier" class="w-full border rounded-lg px-3 py-2" value="AMAZON"></div>
        <div><label class="text-xs text-slate-500">FOB</label><input id="fFob" type="number" step="0.01" value="0" class="w-full border rounded-lg px-3 py-2"></div>
        <div><label class="text-xs text-slate-500">Peso (lb)</label><input id="fWeight" type="number" step="0.01" value="0" class="w-full border rounded-lg px-3 py-2"></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-slate-500">Empaque (id)</label><input id="fPackaging" type="number" class="w-full border rounded-lg px-3 py-2" placeholder="id empaque"></div>
        <div><label class="text-xs text-slate-500">Contenedor</label>
          <select id="fContainer" class="w-full border rounded-lg px-3 py-2"><option value="">— Sin —</option></select></div>
      </div>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="fPrint" checked> Imprimir etiqueta</label>
      <button id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg py-2.5 font-semibold">Agregar paquete</button>
      <div id="subMsg" class="text-sm"></div>
      <div class="text-xs text-slate-400">Pendientes recibido en Miami: <b id="pend">—</b></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
async function jget(u){ return (await fetch(u)).json(); }
async function jpost(u,b){ return (await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json(); }

// ── Cámara del navegador (con selector) ──
let stream = null;
async function listCams(){
  try { await navigator.mediaDevices.getUserMedia({video:true}).then(s=>s.getTracks().forEach(t=>t.stop())); } catch(e){}
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  $('camSel').innerHTML = devs.map((d,i)=>`<option value="${d.deviceId}">${d.label||('Cámara '+(i+1))}</option>`).join('');
  if(devs.length) startCam(devs[0].deviceId);
}
async function startCam(deviceId){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: deviceId?{deviceId:{exact:deviceId}}:{facingMode:'environment'}, audio:false });
    $('cam').srcObject = stream;
    $('capMsg').textContent = 'Cámara lista';
  } catch(e){ $('capMsg').textContent = 'No se pudo abrir la cámara: '+e.message; }
}
$('btnCamStart').onclick = ()=> startCam($('camSel').value);
$('camSel').onchange = ()=> startCam($('camSel').value);
function grabFrame(){
  const v=$('cam'), c=$('canvas');
  if(!v.videoWidth) return null;
  c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  return c.toDataURL('image/jpeg',0.9);
}

async function loadContainers(){
  const r = await jget('/api/containers'); const rows=(r&&r.data)||[];
  $('fContainer').innerHTML = '<option value="">— Sin —</option>' + rows.map(c=>`<option value="${c.id}">${c.code} (${c.pkg_count||0})</option>`).join('');
}
async function loadPending(){ const r=await jget('/api/pending'); $('pend').textContent=(r&&r.success)?(r.total+' (míos '+r.mine+')'):'—'; }

$('btnCapture').onclick = async () => {
  const img = grabFrame();
  if(!img){ $('capMsg').textContent='Cámara no iniciada'; return; }
  $('capMsg').textContent='Leyendo…';
  const r = await jpost('/api/capture',{image:img});
  if(!r.ok){ $('capMsg').textContent=r.message||'Error'; return; }
  if(r.tracking) $('fTracking').value=r.tracking;
  if(r.content) $('fContent').value=r.content;
  if(r.supplier) $('fSupplier').value=r.supplier;
  $('capMsg').textContent='Tracking: '+(r.tracking||'—')+(r.ai_error?(' · IA: '+r.ai_error):'');
  const m=r.client_matches||[];
  const q=(r.casillero||'').replace(/\D/g,'');
  const pick = chooseMatch(m, q);
  if(pick) pickClient(pick);
  else if(r.casillero||r.recipient_name){ $('fClientSearch').value=r.casillero||r.recipient_name; $('fClientSearch').focus(); }
};

$('btnWeight').onclick = async () => {
  $('capMsg').textContent='Pesando…';
  const r=await jget('/api/weight');
  if(r.ok){ $('fWeight').value=Number(r.weight_lb).toFixed(2); $('capMsg').textContent='Peso '+(r.stable?'estable':'')+': '+r.weight_lb+' lb'; }
  else $('capMsg').textContent='Balanza: '+(r.message||'error');
};

// Elige la mejor coincidencia: exacta por dígitos del casillero; si no, única; si no, ninguna.
function chooseMatch(rows, qDigits){
  if(!rows||!rows.length) return null;
  if(qDigits){
    const ex = rows.find(c=> String(c.client_code||'').replace(/\D/g,'').replace(/^0+/,'') === qDigits.replace(/^0+/,''));
    if(ex) return ex;
  }
  return rows.length===1 ? rows[0] : null;
}
function pickClient(c){ $('fClientId').value=c.id; $('clientPicked').textContent='✓ '+c.client_code+' · '+c.name; $('clientPicked').className='text-sm mt-1 text-emerald-700'; $('fClientSearch').value=''; }
$('fClientSearch').addEventListener('keydown', async e=>{ if(e.key!=='Enter')return; e.preventDefault();
  const q=$('fClientSearch').value.trim(); if(!q)return;
  $('clientPicked').textContent='Buscando…'; $('clientPicked').className='text-sm mt-1 text-slate-400'; $('clientPicked').classList.remove('hidden');
  const r=await jget('/api/clients/search?q='+encodeURIComponent(q)); const rows=(r&&r.data)||[];
  const pick = chooseMatch(rows, q.replace(/\D/g,''));
  if(pick){ pickClient(pick); }
  else if(rows.length>1){ $('clientPicked').textContent='⚠ Varios coinciden — escribe el casillero completo'; $('clientPicked').className='text-sm mt-1 text-amber-600'; }
  else { $('clientPicked').textContent='✗ Cliente no encontrado'; $('clientPicked').className='text-sm mt-1 text-rose-600'; }
});

$('btnSubmit').onclick = async () => {
  if(!$('fClientId').value){ $('subMsg').textContent='Selecciona un cliente'; $('subMsg').className='text-sm text-rose-600'; return; }
  if(!(parseFloat($('fWeight').value)>0)){ $('subMsg').textContent='Peso debe ser > 0'; $('subMsg').className='text-sm text-rose-600'; return; }
  $('subMsg').textContent='Guardando…'; $('subMsg').className='text-sm text-slate-500';
  const r=await jpost('/api/submit',{
    client_id:$('fClientId').value, tracking_number:$('fTracking').value.trim(), carrier:$('fCarrier').value.trim(),
    content:$('fContent').value.trim(), supplier:$('fSupplier').value.trim(), packaging_type_id:$('fPackaging').value||0,
    fob:$('fFob').value||0, weight_lb:$('fWeight').value, container_id:$('fContainer').value||0, print:$('fPrint').checked,
  });
  if(r.success){ $('subMsg').textContent='✓ '+r.guia+(r.print_ok?' · impreso':(r.print_msg?(' · impresión: '+r.print_msg):'')); $('subMsg').className='text-sm text-emerald-700';
    ['fTracking','fContent','fSupplier','fWeight'].forEach(i=>$(i).value=''); $('fClientId').value=''; $('clientPicked').classList.add('hidden');
    loadContainers(); loadPending();
  } else { $('subMsg').textContent=r.message||'Error'; $('subMsg').className='text-sm text-rose-600'; }
};

listCams(); loadContainers(); loadPending();
</script>
</body>
</html>
